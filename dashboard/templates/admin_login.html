<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вхід — Адмінка</title>
<link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>
<div class="orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<div class="login-wrap">
  <div class="container" style="max-width:380px;">
    <div class="login-card">
      <h1>🔒 Адмінка</h1>
      <p>Введіть пароль для доступу до налаштувань</p>
      <form method="post" action="/admin/login">
        <div class="form-row">
          <input type="password" name="password" placeholder="Пароль" autofocus required>
        </div>
        <button class="btn" type="submit" style="width:100%;justify-content:center;">Увійти</button>
      </form>
      {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    </div>
  </div>
</div>
</body>
</html>
