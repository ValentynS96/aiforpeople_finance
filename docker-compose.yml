services:
  ai-finansy:
    build: .
    ports:
      - "13500:8000"   # зовнішній порт 13500 (всередині контейнера лишається 8000)
    volumes:
      - ./data:/app/data          # SQLite + мастер-ключ шифрования — persist
    environment:
      - PYTHONPATH=/app
    restart: always               # автозапуск при старте Docker и перезагрузке ПК
    container_name: ai-finansy
