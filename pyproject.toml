[project]
name = "ai-finansy"
version = "1.0.0"
description = "AI фінансовий помічник: дашборд + Telegram-бот + адмінка для аналізу банківських виписок"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
    "cryptography>=43.0.1",
    "requests>=2.32.3",
    "pandas>=2.2.0",
    "pymupdf>=1.24.10",
    "gspread>=6.1.2",
    "google-auth>=2.34.0",
    "python-telegram-bot>=21.6",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
]
pdf = [
    "docling>=2.30.0",
]

[tool.setuptools.packages.find]
include = ["server*", "bot*", "dashboard*"]
